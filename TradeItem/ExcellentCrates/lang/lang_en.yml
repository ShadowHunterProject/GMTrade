        Contents:
        - Tại đây bạn có thể đặt giới hạn số lần mở rương cho mỗi người chơi.
        - ''
        - <soft_yellow>Thời gian chờ (Cooldown)</soft_yellow> đặt khoảng thời gian (tính bằng giây) mà người chơi có thể mở rương theo số lần quy định ở mục <soft_yellow>Số lượng (Amount)</soft_yellow>.
