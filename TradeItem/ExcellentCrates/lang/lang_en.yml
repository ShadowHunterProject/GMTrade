Command:
  Argument:
    Name:
      Crate: rương
      Key: chìa khoá
      X: x
      Y: y
      Z: z
      Rarity: độ hiếm
  Editor:
    Desc: Mở giao diện chỉnh sửa.
  Drop:
    Desc: Tạo vật phẩm rương trên mặt đất.
    Done: <gray>Đã thả <soft_yellow>%crate_name%</soft_yellow> tại <soft_yellow>%location_x%, %location_y%, %location_z%</soft_yellow> ở <soft_yellow>%location_world%</soft_yellow>.</gray>
  DropKey:
    Desc: Tạo vật phẩm chìa khoá trên mặt đất.
    Done: <gray>Đã thả <soft_yellow>%key_name%</soft_yellow> tại <soft_yellow>%location_x%, %location_y%, %location_z%</soft_yellow> ở <soft_yellow>%location_world%</soft_yellow>.</gray>
  Open:
    Desc: Mở một rương.
  OpenFor:
    Desc: Mở rương cho một người chơi.
    Done: <gray>Đã mở <soft_yellow>%crate_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
    Notify: <gray>Bạn đã bị buộc mở <soft_yellow>%crate_name%</soft_yellow>.</gray>
  Give:
    Desc: Tặng rương cho một người chơi.
    Done: <gray>Đã tặng <soft_yellow>x%amount%</soft_yellow> rương <soft_yellow>%crate_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
    Notify: <gray>Bạn đã nhận được <soft_yellow>x%amount%</soft_yellow> <soft_yellow>%crate_name%</soft_yellow>.</gray>
  Key:
    Desc: Quản lý chìa khoá của người chơi.
    Give:
      Desc: Tặng chìa khoá cho một người chơi.
      Done: <gray>Đã tặng <soft_yellow>x%amount%</soft_yellow> chìa khoá <soft_yellow>%key_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
      Notify: <gray>Bạn đã nhận được <soft_yellow>x%amount%</soft_yellow> <soft_yellow>%key_name%</soft_yellow>!</gray>
    Take:
      Desc: Lấy chìa khoá từ một người chơi.
      Done: <gray>Đã lấy đi <soft_yellow>x%amount%</soft_yellow> chìa khoá <soft_yellow>%key_name%</soft_yellow> của <soft_yellow>%player_name%</soft_yellow>.</gray>
      Notify: <gray>Bạn đã bị mất <soft_red>x%amount%</soft_red> <soft_red>%key_name%</soft_red>.</gray>
    Set:
      Desc: Đặt số lượng chìa khoá cho một người chơi.
      Done: <gray>Đã đặt thành <soft_yellow>x%amount%</soft_yellow> chìa khoá <soft_yellow>%key_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
      Notify: <gray>Số lượng <soft_yellow>%key_name%</soft_yellow> của bạn đã thay đổi thành <soft_yellow>x%amount%</soft_yellow>.</gray>
    Show:
      Desc: Xem chìa khoá ảo của người chơi.
      Format:
        List:
        - '[prefix="false"]'
        - ' '
        - '<soft_yellow><b>Chìa khoá ảo của %player_name%: </b></soft_yellow>'
        - '%entry%'
        - ' '
        Entry: '<soft_yellow>▪ <gray>%key_name%: </gray>x%amount%</soft_yellow>'
    GiveAll:
      Desc: Tặng chìa khoá cho tất cả người chơi online.
      Done: <gray>Đã tặng <soft_yellow>x%amount%</soft_yellow> chìa khoá <soft_yellow>%key_name%</soft_yellow> cho <soft_yellow>Tất cả người chơi</soft_yellow>.</gray>
  Preview:
    Desc: Mở xem trước rương.
    Done:
      Others: <gray>Đã mở xem trước rương <soft_yellow>%crate_name%</soft_yellow> cho <soft_yellow>%player_display_name%</soft_yellow>.</gray>
  ResetCooldown:
    Desc: Đặt lại thời gian chờ mở rương của người chơi.
    Done: <gray>Đã đặt lại thời gian chờ mở rương <soft_yellow>%crate_name%</soft_yellow> của <soft_yellow>%player_name%</soft_yellow>.</gray>
  Menu:
    Desc: Mở menu rương.
    Done:
      Others: <gray>Đã mở menu rương cho <soft_yellow>%player_display_name%</soft_yellow>.</gray>
  Pity:
    Desc: Quản lý bảo hiểm của người chơi.
    Add:
      Desc: Thêm bảo hiểm cho người chơi.
      Done: <gray>Đã thêm <soft_yellow>x%amount%</soft_yellow> bảo hiểm cho độ hiếm <soft_yellow>%value%</soft_yellow> ở rương <soft_yellow>%crate_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
    Set:
      Desc: Đặt bảo hiểm cho người chơi.
      Done: <gray>Đã đặt thành <soft_yellow>x%amount%</soft_yellow> bảo hiểm cho độ hiếm <soft_yellow>%value%</soft_yellow> ở rương <soft_yellow>%crate_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
    Reset:
      Desc: Đặt lại bảo hiểm cho người chơi.
      Done: <gray>Đã đặt lại bảo hiểm cho độ hiếm <soft_yellow>%value%</soft_yellow> ở rương <soft_yellow>%crate_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
    Inspect:
      Desc: Xem bộ đếm bảo hiểm của người chơi.
      Format:
        List:
        - '[prefix="false"]'
        - ' '
        - '<soft_yellow><b>Bảo hiểm của %player_name% cho %crate_name%: </b></soft_yellow>'
        - '%entry%'
        - ' '
        Entry: '<soft_yellow>▪ <gray>%value%: </gray>%amount%</soft_yellow>'
Error:
  Command:
    Argument:
      InvalidCrate: <gray><soft_red>%value%</soft_red> không phải là một rương hợp lệ!</gray>
      InvalidKey: <gray><soft_red>%value%</soft_red> không phải là một chìa khoá hợp lệ!</gray>
  DataIsLoading: <soft_red>Dữ liệu đang được tải... Vui lòng thử lại sau.</soft_red>
Crate:
  Open:
    Error:
      InventorySpace:
      - '[type="title",title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0"]'
      - <soft_red><b>Túi Đồ Đã Đầy!</b></soft_red>
      - <gray>Hãy dọn dẹp túi đồ để mở rương.</gray>
      Cooldown:
        Temporary:
        - '[type="title",title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0"]'
        - <soft_red><b>Rương Đang Trong Thời Gian Chờ!</b></soft_red>
        - <gray>Bạn có thể mở lại sau <soft_red>%time%</soft_red></gray>
        OneTimed:
        - '[type="title",title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0"]'
        - <soft_red><b>Rất Tiếc!</b></soft_red>
        - <gray>Bạn đã mở rương một-lần này rồi!</gray>
      NoRewards:
      - '[type="title",title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0"]'
      - <red><b>Rất Tiếc!</b></red>
      - <gray>Không có phần thưởng nào cho bạn! Hãy thử lại sau.</gray>
      Already:
      - '[type="title",title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0"]'
      - <red><b>Rất Tiếc!</b></red>
      - <gray>Bạn đang mở một rương khác rồi!</gray>
    TooExpensive:
    - '[prefix="false"]'
    - ' '
    - <red><b>CHƯA MỞ RƯƠNG:</b></red>
    - '<red>» </red><gray>Rương: </gray><white>%crate_name%</white>'
    - '<red>» </red><gray>Bạn không đủ điều kiện mở rương: %costs%</gray>'
    - ' '
    Milestone:
      Completed: '[prefix="false",sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>Bạn đã hoàn thành cột mốc <green>%milestone_openings% Lần mở </green> và nhận được <green>%reward_name%</green> làm phần thưởng!</gray>'
    Guarantee:
      Info:
      - '[prefix="false",sound="minecraft:ui.toast.challenge_complete;0.8;1.0"]'
      - ' '
      - <yellow><b>ĐẠT MỐC BẢO HIỂM!</b></yellow>
      - <gray>Bạn đã đạt mốc bảo hiểm và nhận được phần thưởng đặc biệt!</gray>
      - ' '
    Reward:
      Broadcast:
      - '[prefix="false",sound="minecraft:block.note_block.bell;0.8;1.0"]'
      - ' '
      - <gray><light_purple>%player_display_name%</light_purple> đã mở <light_purple>%crate_name%</light_purple> và nhận được <light_purple>%reward_name%</light_purple>!</gray>
      - ' '
      - '<gray>Mua thêm chìa khoá tại: <click:open_url:"https://YOUR_LINK_HERE.xyz"><light_purple>[Nhấn để mở Cửa hàng]</light_purple></click></gray>'
      - ' '
  Rewards:
  - '[prefix="false"]'
  - ' '
  - <yellow><b>ĐÃ MỞ RƯƠNG:</b></yellow>
  - '<yellow>» </yellow><gray>Rương: </gray><white>%crate_name%</white>'
  - '<yellow>» </yellow><gray>Phần Thưởng: </gray><white>%rewards%</white>'
  - ' '
  Opened:
    Result:
      Reward: '%reward_name%'
  Preview:
    Error:
      Cooldown: <gray>Bạn có thể xem trước rương này lại sau <soft_red>%time%</soft_red></gray>
