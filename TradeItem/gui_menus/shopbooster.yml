  # ==============================
  # DÒNG 1: BOOSTER XP
  # ==============================
  "xp_1":
    material: BEACON
    slot: 19
    display_name: "&#00FF7F&l★ BOOSTER X2 XP &f(1 Tiếng)"
    lore:
      - "&a↘ Dùng x2 XP Levels khi farm quái"
      - ""
      - "&e&lCách Sử Dụng:"
      - "&f ✦ Sử dụng: &b1 Tiếng"
      - "&f ✦ Booster này vẫn sẽ chạy thời gian"
      - "&f    còn lại kể cả khi bạn offline!!"
      - ""
      - "&c&l* &fGiá: &a30 Xu"
      - "&8(Lưu ý: ấn vào đây là mua luôn, không có xác nhận)"
    click_requirement:
      requirements:
        points:
          type: ">="
          input: "%playerpoints_points%"
          output: "30"
          deny_commands:
            - "[message] &cBạn không đủ Xu để mua!"
            - "[sound] ENTITY_VILLAGER_NO"
            - "[close]"
    click_commands:
      - "[console] p take %player_name% 30"
      - "[sound] ENTITY_PLAYER_LEVELUP"
      - "[console] sl-booster:slb give %player_name% solo-leveling-exp-1h"
      - "[close]"

