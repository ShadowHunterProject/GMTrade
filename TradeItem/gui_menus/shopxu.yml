      - "&#787878&m────────────────────────"
    click_commands:
      - "[console] points take %player_name% 45"
      - "[console] crates key give %player_name% CratesGiap 1"
      - "[message] &#32CD32[&a✔&#32CD32] &aBạn vừa mua thành công <red><bold>✮ <dark_red><bold>CHÌA KHÓA GIÁP <yellow>☾<gold>♛&a!"
